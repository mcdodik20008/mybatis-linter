build:
  maxIssues: 0

coroutines:
  active: true

  # Запрещает GlobalScope — источник утечек и неконтролируемых джоб
  GlobalCoroutineUsage:
    active: true
    excludes:
      - '**/test/**'
      - '**/tests/**'
      - '**/infra/**'
      - '**/mock/**'
      - '**/*Test.kt'

  # Запрещает прямое использование Dispatchers.IO/Default — должен внедряться через DI
  InjectDispatcher:
    active: true
    dispatcherNames:
      - 'IO'
      - 'Default'
      - 'Unconfined'

  # Удаляет suspend, если он не нужен (повышает читаемость)
  RedundantSuspendModifier:
    active: true

  # Thread.sleep() внутри suspend — плохо, требует delay()
  SleepInsteadOfDelay:
    active: true

  # Можно включить, если ты запрещаешь DSL-стиль suspend CoroutineScope.foo()
  SuspendFunWithCoroutineScopeReceiver:
    active: false  # оставить false, если ты используешь builder-style API

  # Обеспечивает реактивность: suspend-функции должны явно возвращать Flow<T>
  SuspendFunWithFlowReturnType:
    active: true

config:
  validation: true

processors:
  active: true

console-reports:
  active: true

style:
  active: false

comments:
  active: false

complexity:
  active: false

empty-blocks:
  active: false

exceptions:
  active: false

naming:
  active: false

performance:
  active: false

potential-bugs:
  active: false