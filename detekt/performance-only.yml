build:
  maxIssues: 0

performance:
  active: true
  # Обнаруживает преобразование `arrayOf(1, 2, 3)` → примитивные массивы: intArrayOf и т.д.
  ArrayPrimitive:
    active: true

  # Рекомендует использовать `asSequence()` при длинных цепочках `map/filter`, чтобы избежать промежуточных коллекций
  CouldBeSequence:
    active: false
    threshold: 3  # от 3+ операций Detekt будет рекомендовать sequence

  # Обнаруживает `.forEach` по диапазону — лучше использовать `for (i in ...)`
  ForEachOnRange:
    active: true

  # Обнаруживает `*array` — дорогая операция (spread оператор)
  SpreadOperator:
    active: true
    excludes:
      - '**/Application.kt'
      - '**/*Test.kt'
      - '**/*Tests.kt'
      - '**/*Config.kt'
      - '**/test/**'
      - '**/config/**'

  # Находит выражения вроде `foo || true` или `bar && false`, где одна часть бесполезна
  UnnecessaryPartOfBinaryExpression:
    active: false

  # Обнаруживает бессмысленные временные объекты: `StringBuilder().toString()`
  UnnecessaryTemporaryInstantiation:
    active: true

config:
  validation: true

processors:
  active: true

console-reports:
  active: true

style:
  active: false

complexity:
  active: false

empty-blocks:
  active: false

exceptions:
  active: false

naming:
  active: false

comments:
  active: false

potential-bugs:
  active: false

coroutines:
  active: false
