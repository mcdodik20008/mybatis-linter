build:
  maxIssues: 0
# Тут нужно подумать что исключить
comments:

  # Требует KDoc у public-классов.
  UndocumentedPublicClass:
    active: true
    excludes:
      - '**/Application.kt'
      - '**/*Test.kt'
      - '**/*Tests.kt'
      - '**/*Controller.kt'
      - '**/*Config.kt'
      - '**/test/**'
      - '**/api/**'
      - '**/config/**'

  # Требует KDoc у public-функций.
  UndocumentedPublicFunction:
    active: true
    excludes:
      - '**/Application.kt'
      - '**/*Test.kt'
      - '**/*Tests.kt'
      - '**/*Controller.kt'
      - '**/*Config.kt'
      - '**/test/**'
      - '**/api/**'
      - '**/config/**'

  # Требует KDoc у public-полей.
  UndocumentedPublicProperty:
    active: true
    excludes:
      - '**/Application.kt'
      - '**/*Test.kt'
      - '**/*Tests.kt'
      - '**/*Controller.kt'
      - '**/*Config.kt'
      - '**/test/**'
      - '**/api/**'
      - '**/config/**'

config:
  validation: true

processors:
  active: true

console-reports:
  active: true

complexity:
  active: false

empty-blocks:
  active: false

exceptions:
  active: false

style:
  active: false

naming:
  active: false

performance:
  active: false

potential-bugs:
  active: false

coroutines:
  active: false
